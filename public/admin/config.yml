# Decap CMS 配置
# 本地开发：npx decap-server 启动本地后端，访问 /admin
# 生产部署：使用 GitHub 后端需配置 OAuth（decapbridge 或 GitHub OAuth App），
#           取消下方 backend 注释并填写 repo，再配置 OAuth 回调。

local_backend: true

backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: main

# 生产环境（部署后启用）：
# backend:
#   name: github
#   repo: ling-ou-pq/myblog
#   branch: main
#   auth_type: implicit

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

collections:
  - name: posts
    label: "博客文章"
    folder: "src/content/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "作者", name: "author", widget: "string", default: "ling-ou-pq" }
      - { label: "发布日期", name: "pubDatetime", widget: "datetime" }
      - { label: "描述", name: "description", widget: "text" }
      - { label: "标签", name: "tags", widget: "list" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "精选", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: workbench
    label: "工作台记录"
    folder: "src/content/workbench"
    create: true
    delete: true
    slug: "{{date}}-{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "string" }
      - { label: "类型", name: "type", widget: "select", options: [todo, record, note], default: "record" }
      - { label: "正文", name: "body", widget: "markdown" }
